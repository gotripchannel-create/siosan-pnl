services:
  siosan-pnl:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      IIKO_SERVER_URL: ${IIKO_SERVER_URL}
      IIKO_API_LOGIN: ${IIKO_API_LOGIN}
      IIKO_API_PASSWORD: ${IIKO_API_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CRON_SECRET: ${CRON_SECRET}
      VK_CONFIRMATION_CODE: ${VK_CONFIRMATION_CODE}
      VK_GROUP_SECRET: ${VK_GROUP_SECRET}
      VK_CALLBACK_SECRET: ${VK_CALLBACK_SECRET}
