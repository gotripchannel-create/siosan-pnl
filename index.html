<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff" />
    <meta name="description" content="СИОСАН — управленческий P&L ресторана" />
    <title>СИОСАН — Управленческий P&L</title>

    <!-- Иконка для «На экран Домой». Режим отдельного PWA намеренно отключён:
         на части iPhone он запускал устаревший изолированный WebView и давал
         белый экран. Ярлык будет открывать тот же стабильный Safari. -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Не используем apple-mobile-web-app-capable: см. комментарий выше. -->
    <meta name="apple-mobile-web-app-title" content="СиоСан" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/png" href="/favicon-32.png" />

    <!-- Шрифты новой дизайн-темы (siosan-theme.css) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  </head>
  <body>
    <!-- ВАЖНО: этот экран находится ВНЕ #root. React очищает содержимое #root
         ещё до своего первого рендера, поэтому встроенный сюда экран не спасал
         от белого экрана при сбое запуска на iPhone. -->
    <div id="boot-screen" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#F4F3EF;color:#1C2321;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center">
      <div>
        <div style="font-size:28px;font-weight:700;letter-spacing:.02em">СИОСАН</div>
        <div id="boot-message" style="margin-top:10px;color:#5B645F;font-size:15px">Загружаем данные…</div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Если WebKit не смог загрузить или выполнить JavaScript, пользователь не
      // увидит пустой белый экран и поймёт, что можно сделать дальше.
      window.setTimeout(function () {
        var message = document.getElementById('boot-message');
        if (message) message.textContent = 'Не удалось запустить приложение. Проверьте интернет и откройте сайт в Safari.';
      }, 15000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
